<div novalidate [formGroup]="screenFormGroup">
    <div class="container-fluid-ov" [magic]="mgc.FrameReport">
        <div class="card">
            <div class="card-header">
                <div class="d-flex justify-content-between align-items-center w-100">
                    <h3><label class="lbl-sm" class="lable_overflow mb-0">
                            {{mg.getText(mgc.Label1)}}
                        </label></h3>
                    <button type="button" [magic]="mgc.btnexit"
                        class="btn btn-danger btn-sm font-weight-bold ml-2">Back</button>
                </div>
            </div>
        </div>
        <div class="card-body">
            <div class="form-group row" style="margin: 0rem;">
                <div class="col-lg-12">
                    <div class="form-group row">
                        <div class="col-lg-3">
                            <label>
                                Search
                            </label>
                            <input class="form-control" [formControlName]="mgc.FrameNo" [magic]="mgc.FrameNo"
                                placeholder="Search by Frame No., Initiated By, Flag Off By" mgFormat />
                            <mgError [magic]=mgc.FrameNo> </mgError>
                            <!-- </div> -->
                        </div>
                        <div class="col-lg-2">
                            <label>
                                Initiated Date
                            </label>
                            <input type="date" class="form-control" [formControlName]="mgc.InitiatedDate"
                                [magic]="mgc.InitiatedDate" dateInput />
                        </div>
                        <div class="col-lg-2">
                            <label>
                                Initiated To Date
                            </label>
                            <input type="date" class="form-control" [formControlName]="mgc.InitiatedToDate"
                                [magic]="mgc.InitiatedToDate" dateInput />
                        </div>

                        <div class="col-lg-2">
                            <label class="lbl-header-tbl">
                                Flag
                            </label>
                            <select class="form-control" [magic]="mgc.vFlag" [formControlName]="mgc.vFlag">
                                <option *ngFor="let o of mg.getItemListValues(mgc.vFlag);"
                                    [selected]="o.index == mg.getValue(mgc.vFlag)" [value]="o.index">
                                    {{o.displayValue}}
                                </option>
                            </select>
                        </div>
                        <div class="col-lg-2">
                            <button type="button" [magic]="mgc.btnPdf"
                                class="btn btn-success font-weight-bold mt-8">PDF</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-12">
            <magic-subform [magic]="mgc.DETAIL">
            </magic-subform>
        </div>
    </div>
</div>
