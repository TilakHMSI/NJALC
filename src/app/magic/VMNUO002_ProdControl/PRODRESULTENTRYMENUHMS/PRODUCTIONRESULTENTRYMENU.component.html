<div novalidate [formGroup]="screenFormGroup">
    <div class="container-fluid-ov" [magic]="mgc.PRODUCTIONRESULTENTRYMENU">
        <div class="card">
            <div class="card-header">
                <div class="d-flex justify-content-between align-items-center w-100">
                    <h3><label class="lable_overflow mb-0">
                            {{mg.getText(mgc.Label4)}}
                        </label></h3>
                    <div class="d-flex align-items-center">
                        <label [magic]="mgc.Edit5" class="mb-0 mr-3">
                            {{mg.getValue(mgc.Edit5)
                            | magicDate : mgc.Edit5}}
                        </label>
                        <label [magic]="mgc.Edit6" class="mb-0 mr-3">
                            {{mg.getValue(mgc.Edit6)
                            | magicTime : mgc.Edit6}}
                        </label>
                        <button type="button" [magic]="mgc.btnexit"
                            class="btn btn-danger btn-sm font-weight-bold ml-2">Back</button>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="form-group row">
                    <div class="col-lg-2">
                        
                    </div>
                    <div class="col-lg-8 text-center">
                        <div class="form-group" *ngIf="mg.getVisible(mgc.AEOFF_RESULT_ENTRYVPRDO041)==='visible'">
                            <button class="btn btn-primary font-weight-bold mb-3 btn-wdth-75"
                                [magic]="mgc.AEOFF_RESULT_ENTRYVPRDO041"
                                *ngIf="mg.getVisible(mgc.AEOFF_RESULT_ENTRYVPRDO041)==='visible'">
                                {{mg.getValue(mgc.AEOFF_RESULT_ENTRYVPRDO041)}}
                            </button>
                        </div>
                        <div class="form-group" *ngIf="mg.getVisible(mgc.AFOFF_RESULT_ENTRYVPRDO042)==='visible'">
                            <button class="btn btn-primary font-weight-bold mb-3 btn-wdth-75"
                                [magic]="mgc.AFOFF_RESULT_ENTRYVPRDO042"
                                *ngIf="mg.getVisible(mgc.AFOFF_RESULT_ENTRYVPRDO042)==='visible'">
                                {{mg.getValue(mgc.AFOFF_RESULT_ENTRYVPRDO042)}}
                            </button>
                        </div>
                        <div class="form-group" *ngIf="mg.getVisible(mgc.VQON_RESULT_ENTRYVPRDO065)==='visible'">
                            <button class="btn btn-primary font-weight-bold mb-3 btn-wdth-75"
                                [magic]="mgc.VQON_RESULT_ENTRYVPRDO065"
                                *ngIf="mg.getVisible(mgc.VQON_RESULT_ENTRYVPRDO065)==='visible'">
                                {{mg.getValue(mgc.VQON_RESULT_ENTRYVPRDO065)}}
                            </button>
                        </div>
                        <div class="form-group" *ngIf="mg.getVisible(mgc.FRM_VQOFF_RESULT_ENTVPRDO043)==='visible'">
                            <button class="btn btn-primary font-weight-bold mb-3 btn-wdth-75"
                                [magic]="mgc.FRM_VQOFF_RESULT_ENTVPRDO043"
                                *ngIf="mg.getVisible(mgc.FRM_VQOFF_RESULT_ENTVPRDO043)==='visible'">
                                {{mg.getValue(mgc.FRM_VQOFF_RESULT_ENTVPRDO043)}}
                            </button>
                        </div>
                        <div class="form-group" *ngIf="mg.getVisible(mgc.PACKING_RESULT_ENTRYVPRDO044)==='visible'">
                            <button class="btn btn-primary font-weight-bold mb-3 btn-wdth-75"
                                [magic]="mgc.PACKING_RESULT_ENTRYVPRDO044"
                                *ngIf="mg.getVisible(mgc.PACKING_RESULT_ENTRYVPRDO044)==='visible'">
                                {{mg.getValue(mgc.PACKING_RESULT_ENTRYVPRDO044)}}
                            </button>
                        </div>
                         <div class="form-group" *ngIf="mg.getVisible(mgc.New_PDIOFF_RESULT_ENTVPRDO066)==='visible'">
                            <button class="btn btn-primary font-weight-bold mb-3 btn-wdth-75"
                                [magic]="mgc.New_PDIOFF_RESULT_ENTVPRDO066"
                                *ngIf="mg.getVisible(mgc.New_PDIOFF_RESULT_ENTVPRDO066)==='visible'">
                                {{mg.getValue(mgc.New_PDIOFF_RESULT_ENTVPRDO066)}}
                            </button>
                        </div>
                        <div class="form-group" *ngIf="mg.getVisible(mgc.AF_TEST)==='visible'">
                            <button class="btn btn-primary font-weight-bold mb-3 btn-wdth-75"
                                [magic]="mgc.AF_TEST">
                                {{mg.getValue(mgc.AF_TEST)}}
                            </button>
                        </div>
                        <div class="form-group" >
                            <button class="btn btn-primary font-weight-bold mb-3 btn-wdth-75"
                                [magic]="mgc.PDI_LOG">
                                {{mg.getValue(mgc.PDI_LOG)}}
                            </button>
                        </div>
                    </div>
                    <div class="col-lg-2">

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
