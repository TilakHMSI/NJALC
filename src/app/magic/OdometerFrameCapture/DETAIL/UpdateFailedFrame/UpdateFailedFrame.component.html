<div novalidate [formGroup]="screenFormGroup">
    <div style="display: flex; flex-direction: column" [magic]="mgc.UpdateFailedFrame">
        <div class="card">
            <div class="card-header">
                <div class="d-flex justify-content-between align-items-center w-100">
                    <h3><label class="lbl-sm" class="lable_overflow mb-0">
                            ODOMETER UPDATE FAILED PARAMETER
                        </label></h3>
                    <button type="button" [magic]="mgc.btnexit"
                        class="btn btn-danger btn-sm font-weight-bold ml-2">Back</button>
                </div>
            </div>
        </div>
        <div class="card-body">
            <div class="form-group row" style="margin: 0rem;">
                <div class="col-lg-12">
                    <div class="form-group row">
                        <div class="col-lg-2">
                        </div>
                        <div class="col-lg-8 border-yellow rounded p-2">
                            <div class="form-group">
                                <label class="lbl-header-tbl">
                                    FRAME NO
                                </label>
                                <label class="lbl-header-tbl-data">
                                    {{mg.getValue(mgc.pFrameNo)}}
                                </label>
                            </div>
                        </div>
                        <div class="col-lg-2">

                        </div>
                        <div class="col-lg-2">

                        </div>

                        <div class="col-lg-8 border-yellow rounded p-2">
                            <label class="lbl-header-tbl">
                                REMARK
                            </label>
                            <textarea [formControlName]="mgc.vRemark" [magic]="mgc.vRemark" class="form-control"
                                id="exampleTextarea" rows="4" mgFormat></textarea>
                            <mgError [magic]=mgc.vRemark> </mgError>
                        </div>
                        <div class="col-lg-2">

                        </div>
                        <div class="col-lg-4">
                        </div>
                        <div class="col-lg-4 ">
                            <div class="d-flex justify-content-center mt-4">
                                <button class="btn btn-sm btn-success" [magic]="mgc.btnUpdate">
                                    Update Remark
                                </button>
                            </div>
                        </div>
                        <div class="col-lg-4">
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
