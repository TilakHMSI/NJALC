<div novalidate [formGroup]="screenFormGroup">
    <div [magic]="mgc.DETAIL">
        <div class="m-tablewrapper pl-0 pr-0">
            <div class="example-container mat-elevation-z8 Table1TableContainerProps">
                <mat-table #table [dataSource]="dataSource" class="container_border" matSort matSortDisableClear
                    (matSortChange)="tableService.sortData($event)">
                    <ng-container [magic]="mgc.Column1" [matColumnDef]="mgc.Column1">
                        <mat-header-cell *matHeaderCellDef mat-sort-header>
                            FRAME NO
                        </mat-header-cell>
                        <mat-cell *matCellDef="let row" magicMark="magicTableRowContainer">
                            <div style="display: flex; flex-direction: row" *ngIf="mg.ifRowCreated(row)">
                                <div [formGroup]="mg.getFormGroupByRow(row.rowId)">
                                    <label [magic]="mgc.FRAMENO" [rowId]="row.rowId">
                                        {{mg.getValue(mgc.FRAMENO, row.rowId)
                                        }}
                                    </label>
                                </div>
                            </div>
                        </mat-cell>
                    </ng-container>
                    <ng-container [magic]="mgc.Column2" [matColumnDef]="mgc.Column2">
                        <mat-header-cell *matHeaderCellDef>
                            INITIATE DATE
                        </mat-header-cell>
                        <mat-cell *matCellDef="let row" magicMark="magicTableRowContainer">
                            <div style="display: flex; flex-direction: row" *ngIf="mg.ifRowCreated(row)">
                                <div [formGroup]="mg.getFormGroupByRow(row.rowId)">
                                    <label [magic]="mgc.INITIATEDATE" [rowId]="row.rowId">
                                        {{mg.getValue(mgc.INITIATEDATE, row.rowId)
                                        | magicDate : mgc.INITIATEDATE}}
                                    </label>
                                </div>
                            </div>
                        </mat-cell>
                    </ng-container>
                    <ng-container [magic]="mgc.Column3" [matColumnDef]="mgc.Column3">
                        <mat-header-cell *matHeaderCellDef>
                            INITIATE TIME
                        </mat-header-cell>
                        <mat-cell *matCellDef="let row" magicMark="magicTableRowContainer">
                            <div style="display: flex; flex-direction: row" *ngIf="mg.ifRowCreated(row)">
                                <div [formGroup]="mg.getFormGroupByRow(row.rowId)">
                                    <label [magic]="mgc.INITIATETIME" [rowId]="row.rowId">
                                        {{mg.getValue(mgc.INITIATETIME, row.rowId)
                                        | magicTime : mgc.INITIATETIME}}
                                    </label>
                                </div>
                            </div>
                        </mat-cell>
                    </ng-container>
                    <ng-container [magic]="mgc.Column4" [matColumnDef]="mgc.Column4">
                        <mat-header-cell *matHeaderCellDef>
                            MTOCODE
                        </mat-header-cell>
                        <mat-cell *matCellDef="let row" magicMark="magicTableRowContainer">
                            <div style="display: flex; flex-direction: row" *ngIf="mg.ifRowCreated(row)">
                                <div [formGroup]="mg.getFormGroupByRow(row.rowId)">
                                    <div>
                                        <input [formControlName]="mgc.MTOCODE" *ngIf="mg.isRowInRowEditing(row)"
                                            [magic]="mgc.MTOCODE" [rowId]="row.rowId" mgFormat />
                                        <mgError [magic]=mgc.MTOCODE [rowId]="row.rowId"> </mgError>
                                        <label *ngIf="!mg.isRowInRowEditing(row)" [magic]="mgc.MTOCODE"
                                            [rowId]="row.rowId">
                                            {{mg.getValue(mgc.MTOCODE, row.rowId)
                                            }} 
                                        <label class="text-danger h3" *ngIf="!mg.isRowInRowEditing(row)" [magic]="mgc.JPMODEL"
                                            [rowId]="row.rowId">
                                            {{mg.getValue(mgc.JPMODEL, row.rowId)
                                            }}
                                        </label>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </mat-cell>
                    </ng-container>
                    <ng-container [magic]="mgc.Column29" [matColumnDef]="mgc.Column29">
                        <mat-header-cell *matHeaderCellDef>
                            PLANT
                        </mat-header-cell>
                        <mat-cell *matCellDef="let row" magicMark="magicTableRowContainer">
                            <div style="display: flex; flex-direction: row" *ngIf="mg.ifRowCreated(row)">
                                <div [formGroup]="mg.getFormGroupByRow(row.rowId)">
                                    <div>
                                        <input [formControlName]="mgc.PLANT" *ngIf="mg.isRowInRowEditing(row)"
                                            [magic]="mgc.PLANT" [rowId]="row.rowId" mgFormat />
                                        <mgError [magic]=mgc.PLANT [rowId]="row.rowId"> </mgError>
                                        <label *ngIf="!mg.isRowInRowEditing(row)" [magic]="mgc.PLANT"
                                            [rowId]="row.rowId">
                                            {{mg.getValue(mgc.PLANT, row.rowId)
                                            }}
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </mat-cell>
                    </ng-container>
                    <ng-container [magic]="mgc.Column17" [matColumnDef]="mgc.Column17">
                        <mat-header-cell *matHeaderCellDef>
                            INITIATE USER
                        </mat-header-cell>
                        <mat-cell *matCellDef="let row" magicMark="magicTableRowContainer">
                            <div style="display: flex; flex-direction: row" *ngIf="mg.ifRowCreated(row)">
                                <div [formGroup]="mg.getFormGroupByRow(row.rowId)">
                                    <div>
                                        <input [formControlName]="mgc.INITIATEUSER" *ngIf="mg.isRowInRowEditing(row)"
                                            [magic]="mgc.INITIATEUSER" [rowId]="row.rowId" mgFormat />
                                        <mgError [magic]=mgc.INITIATEUSER [rowId]="row.rowId"> </mgError>
                                        <label *ngIf="!mg.isRowInRowEditing(row)" [magic]="mgc.INITIATEUSER"
                                            [rowId]="row.rowId">
                                            {{mg.getValue(mgc.INITIATEUSER, row.rowId)
                                            }}
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </mat-cell>
                    </ng-container>
                    <ng-container [magic]="mgc.Column19" [matColumnDef]="mgc.Column19">
                        <mat-header-cell *matHeaderCellDef>
                            FLAG ON
                        </mat-header-cell>
                        <mat-cell *matCellDef="let row" magicMark="magicTableRowContainer">
                            <div style="display: flex; flex-direction: row" *ngIf="mg.ifRowCreated(row)">
                                <div [formGroup]="mg.getFormGroupByRow(row.rowId)">
                                    <input type="checkbox" id="FLAGON_{{row.rowId}}" [formControlName]="mgc.FLAGON"
                                        [magic]="mgc.FLAGON" [rowId]="row.rowId" />
                                </div>
                            </div>
                        </mat-cell>
                    </ng-container>
                    <ng-container [magic]="mgc.Column27" [matColumnDef]="mgc.Column27">
                        <mat-header-cell *matHeaderCellDef>
                        </mat-header-cell>
                        <mat-cell *matCellDef="let row" magicMark="magicTableRowContainer">
                            <div style="display: flex; flex-direction: row" *ngIf="mg.ifRowCreated(row)">
                                <button [magic]="mgc.btnDetails" class="btn-tbl" [rowId]="row.rowId" *ngIf="mg.getVisible(mgc.btnDetails, row.rowId)">
                                    <i class="icon-xl fas fa-arrow-right text-primary" aria-hidden="true"></i>
                                </button>
                            </div>
                        </mat-cell>
                    </ng-container>
                    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
                    <mat-row *matRowDef="let row; columns: displayedColumns;" class="table_row"
                        [ngClass]="{ 'selected': selection.isSelected(row)}" [magicRow]="row?.rowId"
                        (click)="row? tableService.selectRow(row.rowId) : null">
                    </mat-row>
                </mat-table>
                <mat-paginator #paginator [pageSize]="10" [hidePageSize]="true"
                    (page)="tableService.mgOnPaginateChange($event)">
                </mat-paginator>
            </div>
        </div>
    </div>
</div>
