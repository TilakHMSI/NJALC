<div novalidate [formGroup]="screenFormGroup">
    <div [magic]="mgc.CriteriaDetails">
        <div class="card">
            <div class="card-header">
                <div class="d-flex justify-content-between align-items-center w-100">
                    <h3><label class="lbl-sm" class="lable_overflow mb-0">
                            Odometer Reading Entry
                        </label></h3>
                    <button type="button" [magic]="mgc.btnexit"
                        class="btn btn-danger btn-sm font-weight-bold ml-2">Back</button>
                </div>
            </div>
        </div>
        <div class="col-lg-12">
            <div class="form-group row">
                <div class="col-lg-9 border-yellow rounded p-2">
                    <label class=" mt-4 h3">
                        UPDATE ODOMETER READING FOR FRAME NO.

                        <label class="ml-5 text-primary h3" [magic]="mgc.pFrameNo">
                            {{mg.getValue(mgc.pFrameNo) }}
                        </label></label>
                    <!-- <input class="form-control h3" [formControlName]="mgc.pFrameNo" [magic]="mgc.pFrameNo"
                            mgFormat /> -->
                </div>
                <div class="col-lg-3 border-yellow rounded p-2" *ngIf="mg.getVisible(mgc.btnUpdate)==='visible'">
                    <div class="d-flex justify-content-end mt-2 mb-4 mr-5">
                        <button class="btn btn-sm btn-success" [magic]="mgc.btnUpdate">
                            Update
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="m-tablewrapper pl-0 pr-0">
            <div class="example-container mat-elevation-z8 Table1TableContainerProps">
                <mat-table #table [dataSource]="dataSource" class="container_border" matSort matSortDisableClear
                    (matSortChange)="tableService.sortData($event)">
                    <ng-container [magic]="mgc.Column2" [matColumnDef]="mgc.Column2">
                        <mat-header-cell *matHeaderCellDef>
                            SrNo
                        </mat-header-cell>
                        <mat-cell *matCellDef="let row" magicMark="magicTableRowContainer">
                            <div style="display: flex; flex-direction: row" *ngIf="mg.ifRowCreated(row)">
                                <label [magic]="mgc.Label1" [rowId]="row.rowId" class="lable_overflow">
                                    {{mg.getText(mgc.Label1, row.rowId)}}
                                </label>
                            </div>
                        </mat-cell>
                    </ng-container>
                    <ng-container [magic]="mgc.Column3" [matColumnDef]="mgc.Column3">
                        <mat-header-cell *matHeaderCellDef>
                            CRITERIA
                        </mat-header-cell>
                        <mat-cell *matCellDef="let row" magicMark="magicTableRowContainer">
                            <div style="display: flex; flex-direction: row" *ngIf="mg.ifRowCreated(row)">
                                <div [formGroup]="mg.getFormGroupByRow(row.rowId)">
                                    <label [magic]="mgc.SHIPPINGCRITERIA" [rowId]="row.rowId">
                                        {{mg.getValue(mgc.SHIPPINGCRITERIA, row.rowId)
                                        }}
                                    </label>
                                </div>
                            </div>
                        </mat-cell>
                    </ng-container>
                    <ng-container [magic]="mgc.Column34" [matColumnDef]="mgc.Column34">
                        <mat-header-cell *matHeaderCellDef>
                            REMARKS
                        </mat-header-cell>
                        <mat-cell *matCellDef="let row" magicMark="magicTableRowContainer">
                            <div style="display: flex; flex-direction: row" *ngIf="mg.ifRowCreated(row)">
                                <div [formGroup]="mg.getFormGroupByRow(row.rowId)">
                                    <div>
                                        <label [magic]="mgc.OdoCriteriaMaster_REMARKS" [rowId]="row.rowId">
                                            {{mg.getValue(mgc.OdoCriteriaMaster_REMARKS, row.rowId)
                                            }}
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </mat-cell>
                    </ng-container>
                    <ng-container [magic]="mgc.Column4" [matColumnDef]="mgc.Column4">
                        <mat-header-cell *matHeaderCellDef>
                            READING
                        </mat-header-cell>
                        <mat-cell *matCellDef="let row" magicMark="magicTableRowContainer">
                            <div style="display: flex; flex-direction: row" *ngIf="mg.ifRowCreated(row)">
                                <div [formGroup]="mg.getFormGroupByRow(row.rowId)">
                                    <div>
                                        <input [formControlName]="mgc.READINGFROM" class="form-control-ent" type='number'
                                            [magic]="mgc.READINGFROM" [rowId]="row.rowId" mgFormat />
                                        <mgError [magic]=mgc.READINGFROM [rowId]="row.rowId"> </mgError>
                                    </div>
                                </div>
                            </div>
                        </mat-cell>
                    </ng-container>
                    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
                    <mat-row *matRowDef="let row; columns: displayedColumns;" class="table_row"
                        [ngClass]="{ 'selected': selection.isSelected(row)}" [magicRow]="row?.rowId"
                        (click)="row? tableService.selectRow(row.rowId) : null">
                    </mat-row>
                </mat-table>
                <mat-paginator #paginator [pageSize]="10" [hidePageSize]="true"
                    (page)="tableService.mgOnPaginateChange($event)">
                </mat-paginator>
            </div>
        </div>
    </div>
</div>
